name: docs-check

# Catches the two things that quietly rot a PM-run repo:
# unresolved gap markers, and internal links pointing at files that don't exist.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warn on unresolved gap markers in changed docs
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- '*.md' || true)
          [ -z "$CHANGED" ] && { echo "No markdown changed."; exit 0; }
          FOUND=0
          for f in $CHANGED; do
            [ -f "$f" ] || continue
            if grep -n "NEEDS INPUT" "$f"; then
              echo "::warning file=$f::Unresolved '⚠️ NEEDS INPUT' marker — fine for a draft, not for an approved doc."
              FOUND=1
            fi
          done
          # Warning only, never a blocker: drafts are supposed to have gaps.
          exit 0

      - name: Fail on broken internal links
        run: |
          BROKEN=0
          while IFS= read -r f; do
            # Pull out relative markdown links, ignoring http(s) and anchors.
            grep -oE '\]\(([^)#]+)\)' "$f" 2>/dev/null | sed -E 's/^\]\((.*)\)$/\1/' | while read -r link; do
              case "$link" in
                http*|mailto:*|"") continue ;;
              esac
              target="$(dirname "$f")/$link"
              if [ ! -e "$target" ]; then
                echo "::error file=$f::Broken link → $link"
                exit 1
              fi
            done || BROKEN=1
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*')
          exit $BROKEN
