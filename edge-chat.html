<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge – Emeka's AI Hiring Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg-enter { animation: fadeIn 0.3s ease forwards; }

        @keyframes pulse-dot {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40%            { opacity: 1;   transform: scale(1); }
        }
        .typing-dot:nth-child(1) { animation: pulse-dot 1.2s infinite 0.0s; }
        .typing-dot:nth-child(2) { animation: pulse-dot 1.2s infinite 0.2s; }
        .typing-dot:nth-child(3) { animation: pulse-dot 1.2s infinite 0.4s; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        #messages { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">

    <!-- Top Bar -->
    <header class="flex-shrink-0 bg-slate-950/80 backdrop-blur-lg border-b border-slate-800/50 px-4 py-3 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </a>
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500 to-orange-700 flex items-center justify-center shadow-lg shadow-orange-900/40">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                    </svg>
                </div>
                <div>
                    <p class="font-semibold text-sm leading-tight">Edge</p>
                    <p class="text-xs text-slate-400 leading-tight">Emeka's AI Hiring Assistant</p>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-xs text-slate-400">Online</span>
        </div>
    </header>

    <!-- Messages -->
    <main id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-4">
        <!-- Initial greeting rendered by JS -->
    </main>

    <!-- Suggested prompts -->
    <div id="suggestions" class="flex-shrink-0 px-4 pb-3 flex flex-wrap gap-2">
        <button onclick="sendSuggestion(this)" class="suggest-btn text-xs border border-slate-700 hover:border-orange-500/60 hover:text-orange-400 text-slate-400 px-3 py-1.5 rounded-full transition-all">Tell me about his fintech experience</button>
        <button onclick="sendSuggestion(this)" class="suggest-btn text-xs border border-slate-700 hover:border-orange-500/60 hover:text-orange-400 text-slate-400 px-3 py-1.5 rounded-full transition-all">What roles is he open to?</button>
        <button onclick="sendSuggestion(this)" class="suggest-btn text-xs border border-slate-700 hover:border-orange-500/60 hover:text-orange-400 text-slate-400 px-3 py-1.5 rounded-full transition-all">What's his biggest achievement?</button>
        <button onclick="sendSuggestion(this)" class="suggest-btn text-xs border border-slate-700 hover:border-orange-500/60 hover:text-orange-400 text-slate-400 px-3 py-1.5 rounded-full transition-all">Is he open to remote work?</button>
    </div>

    <!-- Input -->
    <footer class="flex-shrink-0 bg-slate-950/80 backdrop-blur-lg border-t border-slate-800/50 px-4 py-3">
        <form id="chat-form" class="flex gap-3 items-end max-w-4xl mx-auto" onsubmit="handleSubmit(event)">
            <textarea
                id="user-input"
                rows="1"
                placeholder="Ask about Emeka's background, experience, or availability…"
                class="flex-1 bg-slate-900 border border-slate-700 focus:border-orange-500/60 outline-none rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 resize-none transition-colors leading-relaxed"
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"
            ></textarea>
            <button type="submit" id="send-btn"
                    class="flex-shrink-0 w-11 h-11 bg-gradient-to-br from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 rounded-xl flex items-center justify-center transition-all shadow-lg shadow-orange-900/40 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
            </button>
        </form>
        <p class="text-center text-xs text-slate-600 mt-2 max-w-4xl mx-auto">
            Edge is an AI. For direct contact: <a href="mailto:emeka.victor.ugochukwu@gmail.com" class="text-slate-500 hover:text-orange-400 transition-colors">email</a> · <a href="https://linkedin.com/in/theecleticman" target="_blank" class="text-slate-500 hover:text-orange-400 transition-colors">LinkedIn</a>
        </p>
    </footer>

    <script>
    // ── System context ──────────────────────────────────────────────────────────
    const SYSTEM_PROMPT = `You are Edge, the personal AI hiring assistant for Emeka Ugochukwu, a senior product leader in fintech and B2B SaaS.

Your purpose is to help recruiters, hiring managers, and potential collaborators understand Emeka's background, assess role fit, and decide whether to reach out to him directly.

## About Emeka

**Current Role:** Product Lead at Moniepoint (Africa's largest POS network with 4.4M+ devices)
- Launched a new product that achieved 30,000+ activations and ₦1B+ in transactions in Q3 alone
- Leads cross-functional squads across engineering, design, data, and operations
- Focus: merchant payments, device lifecycle, B2B2C distribution

**Previous Role:** Product Manager at Qore
- Scaled B2B SaaS platform adoption by 2,500% in one year
- Reduced transaction failure rates by 60% through systematic root-cause analysis
- Generated ₦63M in revenue in Q1 through product-led growth initiatives
- Built the core payments infrastructure used by Nigerian banks and fintechs

**Career Summary:**
- 7+ years in product management, primarily fintech, payments, and B2B SaaS
- Deep expertise in: payment rails, POS/device networks, merchant onboarding, failure analysis, B2B product-led growth
- Strong operator: comfortable with both strategy and execution, data-driven, cross-functional leader
- Education: Computer Science background, continuous learner in product and technology

**What he looks for in opportunities:**
- High-impact product roles in fintech, payments, or B2B SaaS
- Companies solving real infrastructure problems at scale
- Senior IC or leadership roles (Senior PM, Principal PM, Director of Product, Head of Product)
- Open to global remote roles and relocation for the right opportunity
- Particularly excited about: emerging markets fintech, financial inclusion, payment infrastructure, developer tools for payments

**Compensation:** Open to competitive market rates; prefers equity-heavy packages for early-stage, cash-competitive for later-stage

**Availability:** Currently employed but actively exploring; responsive via LinkedIn and email

**Contact:**
- LinkedIn: https://linkedin.com/in/theecleticman
- Email: emeka.victor.ugochukwu@gmail.com
- WhatsApp: +234 905 937 1877

## Your style

- Be warm, direct, and professional
- Lead with specific metrics and examples — Emeka's results speak for themselves
- Ask clarifying questions to assess role fit (company stage, problem space, team size)
- If there seems to be a strong fit, encourage them to reach out directly
- If it's a clear mismatch (e.g., pure front-end dev role, non-PM roles), be honest and polite
- Keep responses concise — 2–4 short paragraphs maximum unless they ask for detail
- Never make up information not listed above; say "I'd need to check with Emeka on that" for unknowns`;

    // ── State ───────────────────────────────────────────────────────────────────
    const conversationHistory = [];
    let isLoading = false;

    // ── DOM helpers ─────────────────────────────────────────────────────────────
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const suggestionsEl = document.getElementById('suggestions');

    function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, text) {
        const isUser = role === 'user';
        const wrapper = document.createElement('div');
        wrapper.className = `flex msg-enter ${isUser ? 'justify-end' : 'justify-start'}`;

        const bubble = document.createElement('div');
        bubble.className = isUser
            ? 'bg-gradient-to-br from-orange-500 to-orange-600 rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%] text-sm leading-relaxed'
            : 'bg-slate-800 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-sm leading-relaxed text-slate-200';

        // Simple markdown: bold, line breaks
        bubble.innerHTML = escapeHtml(text)
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');

        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);
        scrollBottom();
        return bubble;
    }

    function appendTypingIndicator() {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex justify-start msg-enter';
        wrapper.id = 'typing-indicator';
        wrapper.innerHTML = `
          <div class="bg-slate-800 rounded-2xl rounded-tl-sm px-4 py-3">
            <div class="flex gap-1.5 items-center h-4">
              <span class="typing-dot w-2 h-2 bg-slate-400 rounded-full"></span>
              <span class="typing-dot w-2 h-2 bg-slate-400 rounded-full"></span>
              <span class="typing-dot w-2 h-2 bg-slate-400 rounded-full"></span>
            </div>
          </div>`;
        messagesEl.appendChild(wrapper);
        scrollBottom();
    }

    function removeTypingIndicator() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function setLoading(val) {
        isLoading = val;
        sendBtn.disabled = val;
        inputEl.disabled = val;
    }

    // ── Init greeting ───────────────────────────────────────────────────────────
    function init() {
        const greeting = "Hi! I'm Edge, Emeka's AI hiring assistant. I'm here to help you understand his background and figure out if there's a mutual fit — no calendar needed.\n\nWhat brings you here today?";
        appendMessage('assistant', greeting);
        conversationHistory.push({ role: 'assistant', content: greeting });
    }

    // ── Send message ────────────────────────────────────────────────────────────
    async function sendMessage(text) {
        if (!text.trim() || isLoading) return;

        // Hide suggestions after first user message
        suggestionsEl.style.display = 'none';

        appendMessage('user', text);
        conversationHistory.push({ role: 'user', content: text });

        setLoading(true);
        appendTypingIndicator();

        try {
            const reply = await callAPI(conversationHistory);
            removeTypingIndicator();
            appendMessage('assistant', reply);
            conversationHistory.push({ role: 'assistant', content: reply });
        } catch (err) {
            removeTypingIndicator();
            const errMsg = err.message === 'NO_API_KEY'
                ? "Edge isn't configured yet — the API key is missing. To contact Emeka directly: linkedin.com/in/theecleticman or emeka.victor.ugochukwu@gmail.com"
                : `Something went wrong: ${err.message}. Please try again or contact Emeka directly.`;
            appendMessage('assistant', errMsg);
        } finally {
            setLoading(false);
        }
    }

    // ── API call ────────────────────────────────────────────────────────────────
    async function callAPI(messages) {
        // Try backend proxy first, then direct (requires CORS-enabled setup)
        const endpoints = ['/api/chat', 'http://localhost:3000/api/chat'];

        for (const endpoint of endpoints) {
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages, system: SYSTEM_PROMPT }),
                    signal: AbortSignal.timeout(30000)
                });

                if (res.ok) {
                    const data = await res.json();
                    return data.content;
                }

                if (res.status === 401) throw new Error('NO_API_KEY');
            } catch (e) {
                if (e.message === 'NO_API_KEY') throw e;
                // Try next endpoint
            }
        }

        throw new Error('NO_API_KEY');
    }

    // ── Event handlers ──────────────────────────────────────────────────────────
    function handleSubmit(e) {
        e.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';
        autoResize(inputEl);
        sendMessage(text);
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSubmit(e);
        }
    }

    function sendSuggestion(btn) {
        sendMessage(btn.textContent.trim());
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    // ── Boot ────────────────────────────────────────────────────────────────────
    init();
    </script>
</body>
</html>
